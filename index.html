<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI WhatsApp Message Writer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    
    <h1>💬 AI WhatsApp Message Generator</h1>
    <p>Create perfect messages instantly using AI</p>

    <!-- ===================== -->
    <!-- MODE 1: QUICK MODE -->
    <!-- ===================== -->
    <h2>✅ Quick Mode</h2>

    <label>Choose Context:</label>
    <select id="context">
      <option selected disabled>SELECT</option>
      <option>Birthday Wish</option>
      <option>Sorry Message</option>
      <option>Formal Request</option>
      <option>Thank You</option>
      <option>Invitation</option>
      <option>Congratulations</option>
      <option>Get Well Soon</option>
      <option>Good Morning</option>
      <option>Good Night</option>
      <option>Missing You</option>
      <option>Apology</option>
      <option>Motivational</option>
      <option>Love Message</option>
      <option>Friendship Message</option>
      <option>Holiday Greetings</option>
    </select>

    <label>Select Tone:</label>
    <select id="tone">
      <option selected disabled>SELECT</option>
      <option>Friendly</option>
      <option>Formal</option>
      <option>Funny</option>
      <option>Emotional</option>
      <option>Casual</option>
      <option>Romantic</option>
      <option>Professional</option>
      <option>Inspirational</option>
    </select>

    <label>Enter Name / Details:</label>
    <input type="text" id="name" placeholder="Example: Rahul, Best Friend">

    <hr>

    <!-- ===================== -->
    <!-- MODE 2: CUSTOM MODE -->
    <!-- ===================== -->
    <h2>✍️ Custom Mode</h2>

    <label>Type Your Situation:</label>
    <textarea id="custom" rows="4"
      placeholder="Example: Write a message asking my boss for leave tomorrow"></textarea>

    <!-- Generate Button -->
    <button onclick="generateMessage()">✨ Generate Message</button>

    <!-- ===================== -->
    <!-- OUTPUT SECTION -->
    <!-- ===================== -->
    <h2>📩 Output Message</h2>
    <textarea id="output" rows="6" readonly></textarea>

    <!-- Copy Button -->
    <button onclick="copyMessage()">📋 Copy Message</button>

    <!-- WhatsApp Share Button (NEW Feature v2.0) -->
    <button onclick="shareWhatsApp()">📤 Send to WhatsApp</button>

    <!-- Footer -->
    <p class="footer">Version 1.2 | Made by SHREYAS ❤️</p>

  </div>

  <script src="script.js"></script>

</body>
</html>
